name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 仅安装测试所需轻量依赖（纯函数测试不依赖 torch / Milvus / LLM）
      - name: Install test dependencies
        run: pip install pytest ruff loguru python-dotenv

      - name: Lint (new code)
        run: ruff check app/utils/retrieval_utils.py app/utils/milvus_filter_utils.py tests/

      - name: Run unit tests
        run: pytest tests/ -v
